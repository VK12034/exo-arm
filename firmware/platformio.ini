; PlatformIO project for the exoskeleton arm firmware.
;
;   pio run -e teensy41          build
;   pio run -e teensy41 -t upload
;   pio test -e native           run the host-side unit tests
[platformio]
default_envs = teensy41

[env]
build_flags =
    -Wall
    -Wextra

[env:teensy41]
platform = teensy@^5.0.0
board = teensy41
framework = arduino
build_flags =
    ${env.build_flags}
    -std=gnu++17
build_unflags = -std=gnu++14
lib_deps =
    paulstoffregen/Encoder@^1.4.4
monitor_speed = 921600
upload_protocol = teensy-cli

; Unit tests for the hardware-independent maths. The firmware sources all
; pull in Arduino.h, so they are excluded here and only the headers under
; include/ are compiled into the tests.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    ${env.build_flags}
    -std=c++17
    -Iinclude
