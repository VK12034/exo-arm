; PlatformIO project for the powered elbow firmware.
;
;   pio run -e uno              build
;   pio run -e uno -t upload    flash
;   pio device monitor          watch the status output
;   pio test -e native          run the unit tests on the host
[platformio]
default_envs = uno

[env]
build_flags =
    -Wall
    -Wextra

[env:uno]
platform = atmelavr@^5.0.0
board = uno
framework = arduino
monitor_speed = 115200
build_flags =
    ${env.build_flags}
    -std=gnu++17
build_unflags = -std=gnu++11

; Unit tests for the planning and debounce logic. Everything under src/ pulls
; in Arduino.h, so only the hardware-independent headers are compiled here.
[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags =
    ${env.build_flags}
    -std=c++17
    -Iinclude
